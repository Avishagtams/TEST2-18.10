<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGINT OPS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- חלק ראשון  -->
  <header class="main-header">
  <div class="header-left">
    <div class="icon-shield">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000">        <path d="M480-80q-139-35-229.5-159.5T160-516v-244l320-120 320 120v244q0 152-90.5 276.5T480-80Zm0-84q104-33 172-132t68-220v-189l-240-90-240 90v189q0 121 68 220t172 132Zm0-316Z"/>
      </svg>
    </div>
  </div>

  <div class="header-center">
    <span class="app-title">SIGINT 0PS</span>
  </div>

  <div class="header-right">
    <div class="header-right-badge">
      <span class="header-right-dot"></span>
      <span class="sec-on-text">SECURE • ONLINE</span>
    </div>
  </div>
</header>
<!-- חלק שני -->
<div class="main-box">
  
    <div class="radar">
      <div class="sweep"></div>
      <div class="blip blip-1"></div>
      <div class="blip blip-2"></div>
      <div class="blip blip-3"></div>
    </div>
  
    <div class="stats-container">
      <div class="stat-item">
        <span class="stat-number">24</span>
        <span class="stat-label">ACTIVE SIGNALS</span>
      </div>
      <div class="stat-item">
        <span class="stat-number">07</span>
        <span class="stat-label">PRIORITY ALERTS</span>
      </div>
    </div>
  
  </div>

  <!-- חלק שלישי -->
<div class="action-buttons-container">
  
    <button class="action-btn">
      <svg class="btn-icon-svg" xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px">
        <path d="m280-80 160-300-320-40 480-460h80L520-580l320 40L360-80h-80Zm222-247 161-154-269-34 63-117-160 154 268 33-63 118Zm-22-153Z"/>
      </svg>
      <span>New Brief</span>
    </button>
  
    <button class="action-btn">
      <span class="btn-text-icon">&lt;&gt;</span>
      <span>Decode</span>
    </button>
  
    <button class="action-btn">
      <svg class="btn-icon-svg" xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px">
        <path d="m397-115-99-184-184-99 71-70 145 25 102-102-317-135 84-86 385 68 124-124q23-23 57-23t57 23q23 23 23 56.5T822-709L697-584l68 384-85 85-136-317-102 102 26 144-71 71Z"/>
      </svg>
      <span>Request Drone</span>
    </button>
  
  </div>
  
    <!-- חלק רביעיייי -->

    <div class="cards">

    <div class="card border-green">
      <div class="card-top">
        <span class="tag tag-red">CRITICAL</span>
        <span class="status">In Progress</span>
      </div>
      <div class="title">Operation Nightfall</div>
      <div class="prog-box">
        <div class="bar-bg">
          <div class="bar" style="width: 65%;"></div>
        </div>
        <span class="percent">65%</span>
      </div>
    </div>
  
    <div class="card border-yellow">
      <div class="card-top">
        <span class="tag tag-yellow">HIGH</span>
        <span class="status">Analyzing</span>
      </div>
      <div class="title">Signal Intercept Alpha</div>
      <div class="prog-box">
        <div class="bar-bg">
          <div class="bar" style="width: 40%;"></div>
        </div>
        <span class="percent">40%</span>
      </div>
    </div>
  
    <div class="card border-green">
      <div class="card-top">
        <span class="tag tag-green">MEDIUM</span>
        <span class="status">Pending</span>
      </div>
      <div class="title">Asset Recovery</div>
      <div class="prog-box">
        <div class="bar-bg">
          <div class="bar" style="width: 15%;"></div>
        </div>
        <span class="percent">15%</span>
      </div>
    </div>
  
    <div class="card border-yellow">
      <div class="card-top">
        <span class="tag tag-yellow">HIGH</span>
        <span class="status">Active</span>
      </div>
      <div class="title">Cyber Defense Grid</div>
      <div class="prog-box">
        <div class="bar-bg">
          <div class="bar" style="width: 80%;"></div>
        </div>
        <span class="percent">80%</span>
      </div>
    </div>
  
  </div>

  <!-- חלק חמישי -->
  <div class="alert-box">
    <span class="alert-dot"></span>
    <span class="alert-text">THREAT DETECTED</span>
  </div>

</body>
</html>
